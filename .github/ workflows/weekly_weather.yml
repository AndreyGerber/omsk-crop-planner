name: Weekly short-term weather fetch

on:
  schedule:
    # Jeden Montag 03:00 UTC (= 08:00 Uhr Omsk-Zeit, UTC+5)
    - cron: "0 3 * * 1"
  workflow_dispatch: {}  # erlaubt manuellen Start über die GitHub-UI

jobs:
  fetch-weekly-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Wetterdaten abrufen
        working-directory: scripts
        run: python fetch_short_term.py

      - name: Änderungen committen
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: weekly short-term weather data update"
          file_pattern: "data/short_term/*.csv"