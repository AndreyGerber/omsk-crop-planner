name: Yearly long-term climate trend fetch

on:
  schedule:
    # Jeden 1. Januar, 03:00 UTC
    - cron: "0 3 1 1 *"
  workflow_dispatch: {}  # erlaubt manuellen Start über die GitHub-UI

jobs:
  fetch-yearly-climate:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: 10-Jahres-Klimadaten abrufen
        working-directory: scripts
        run: python fetch_long_term.py

      - name: Änderungen committen
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: yearly long-term climate trend update"
          file_pattern: "data/long_term/*.csv"